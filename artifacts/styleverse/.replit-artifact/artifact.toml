kind = "web"
previewPath = "/"
title = "StyleVerse"
version = "1.0.0"
id = "artifacts/styleverse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20978

[services.development]
run = "pnpm --filter @workspace/styleverse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/styleverse", "run", "build" ]
serve = "static"
publicDir = "artifacts/styleverse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20978"
BASE_PATH = "/"
